name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: chiklati-bank
  ECS_CLUSTER: chiklati-bank

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requires two repo VARIABLES (Settings -> Secrets and variables ->
      # Actions -> Variables) set after `terraform apply` in infra/:
      #   AWS_DEPLOY_ROLE_ARN -> output "github_deploy_role_arn"
      #   APP_PUBLIC_URL      -> output "public_url"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push api image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          docker build -f apps/api/Dockerfile \
            -t "$ECR_REGISTRY/$PROJECT_NAME-api:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$PROJECT_NAME-api:latest" .
          docker push "$ECR_REGISTRY/$PROJECT_NAME-api:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-api:latest"

      - name: Build and push web image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          docker build -f apps/web/Dockerfile \
            -t "$ECR_REGISTRY/$PROJECT_NAME-web:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$PROJECT_NAME-web:latest" .
          docker push "$ECR_REGISTRY/$PROJECT_NAME-web:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-web:latest"

      # The EC2 host only has ~940MB registered for ECS; api+worker+web
      # already reserve ~700-880MB of that, leaving too little headroom to
      # place a migration task alongside them (confirmed via
      # `aws ecs describe-container-instances` returning 60MB free).
      # Scaling worker to 0 is safe -- BullMQ jobs just queue in Redis and
      # get processed once it comes back up in the deploy step below.
      - name: Free capacity for the migration task
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$PROJECT_NAME-worker" \
            --desired-count 0 >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$PROJECT_NAME-worker"

      # RDS isn't reachable from a GitHub-hosted runner (no NAT Gateway, not
      # publicly accessible -- deliberately, to stay free-tier). Migrations
      # run as a one-off ECS task on the same EC2 instance, inside the VPC,
      # using the api image's full monorepo layout (see apps/api/Dockerfile's
      # comment on why `pnpm --filter` needs that, not a flattened image).
      - name: Run database migration
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          NEW_IMAGE="$ECR_REGISTRY/$PROJECT_NAME-api:${{ github.sha }}"

          aws ecs describe-task-definition \
            --task-definition "$PROJECT_NAME-api" \
            --query 'taskDefinition' > base-task-def.json

          # memoryReservation explicitly small: the EC2 host only has ~940MB
          # registered total, and the api/worker/web services alone reserve
          # ~700MB of that -- confirmed via `aws ecs describe-container-instances`
          # that leaving this at the api service's own reservation (250MB)
          # left too little headroom for this task to ever get placed.
          jq --arg IMAGE "$NEW_IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].command = ["pnpm","--filter","@chiklati/db","run","migrate:deploy"]
            | .containerDefinitions[0].workingDirectory = "/app"
            | .containerDefinitions[0].memoryReservation = 100
            | del(.containerDefinitions[0].portMappings)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' base-task-def.json > migrate-task-def.json

          MIGRATE_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://migrate-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_TASK_DEF_ARN" \
            --launch-type EC2 \
            --count 1 \
            --query 'tasks[0].taskArn' --output text)

          echo "Waiting for migration task $TASK_ARN to stop..."
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            aws logs tail "/ecs/$PROJECT_NAME/api" --since 10m || true
            exit 1
          fi
          echo "Migration succeeded."

      - name: Deploy api, worker, and web services
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          # memoryReservation is set explicitly on every deploy (matching
          # infra/ecs-task-definitions.tf) rather than trusting whatever the
          # previous revision had -- the task defs' `ignore_changes` lifecycle
          # rule means a `terraform apply` alone won't fix already-running
          # services if these ever drift.
          deploy_service() {
            local SERVICE=$1
            local FAMILY=$2
            local IMAGE=$3
            local MEMORY=$4

            aws ecs describe-task-definition --task-definition "$FAMILY" \
              --query 'taskDefinition' > "$FAMILY-base.json"

            jq --arg IMAGE "$IMAGE" --argjson MEMORY "$MEMORY" '
              .containerDefinitions[0].image = $IMAGE
              | .containerDefinitions[0].memoryReservation = $MEMORY
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ' "$FAMILY-base.json" > "$FAMILY-new.json"

            NEW_ARN=$(aws ecs register-task-definition \
              --cli-input-json "file://$FAMILY-new.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)

            # --desired-count 1 explicitly: the worker service was scaled to
            # 0 in the "Free capacity" step above and must be restored here.
            # --deployment-configuration forces stop-then-start instead of
            # ECS's default rolling deploy, which needs room for old+new
            # tasks simultaneously -- impossible on one host-networked
            # instance (confirmed via a real "insufficient memory" failure).
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE" \
              --task-definition "$NEW_ARN" --desired-count 1 \
              --deployment-configuration minimumHealthyPercent=0,maximumPercent=100 >/dev/null
          }

          deploy_service "$PROJECT_NAME-api" "$PROJECT_NAME-api" "$ECR_REGISTRY/$PROJECT_NAME-api:${{ github.sha }}" 250
          deploy_service "$PROJECT_NAME-worker" "$PROJECT_NAME-worker" "$ECR_REGISTRY/$PROJECT_NAME-api:${{ github.sha }}" 150
          deploy_service "$PROJECT_NAME-web" "$PROJECT_NAME-web" "$ECR_REGISTRY/$PROJECT_NAME-web:${{ github.sha }}" 300

          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services "$PROJECT_NAME-api" "$PROJECT_NAME-worker" "$PROJECT_NAME-web"

      - name: Smoke test
        run: curl -f "${{ vars.APP_PUBLIC_URL }}/health"
