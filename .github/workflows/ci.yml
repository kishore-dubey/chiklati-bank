name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # apps/api/vitest.config.ts hardcodes DATABASE_URL/REDIS_URL pointing at
    # the same ports the local docker-compose.yml uses (5433/6380) -- these
    # service containers match that exactly so the integration tests have
    # something to connect to on the runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chiklati
          POSTGRES_PASSWORD: chiklati
          POSTGRES_DB: chiklati_bank
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chiklati -d chiklati_bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to the test database
        run: pnpm --filter @chiklati/db run migrate:deploy
        env:
          DATABASE_URL: postgresql://chiklati:chiklati@localhost:5433/chiklati_bank?schema=public

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # next build executes server code while collecting page data, which
        # runs webEnvSchema validation -- these only need to be well-formed,
        # never connected to (same issue as apps/web/Dockerfile's build stage).
        run: pnpm build
        env:
          DATABASE_URL: postgresql://chiklati:chiklati@localhost:5433/chiklati_bank?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-build-placeholder-unused-at-runtime
          INTERNAL_API_SECRET: ci-build-placeholder-unused-at-runtime

      - name: Audit
        # Non-blocking: current findings are all in next's own transitive
        # deps (sharp, postcss, brace-expansion) with no fix available until
        # Next.js bumps them upstream -- still visible in the log, just
        # doesn't fail every push over vulnerabilities we can't act on.
        run: pnpm audit --audit-level=high
        continue-on-error: true
